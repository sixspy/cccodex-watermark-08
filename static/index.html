<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>血缘水印台</title>
  <link rel="stylesheet" href="/static/css/watermark.css" />
</head>
<body>
  <div class="frame">
    <header>
      <div>
        <p class="eyebrow" id="lab-name">血缘水印台</p>
        <h1 style="margin:0;font-size:1.25rem">产出表盖印与追索</h1>
      </div>
      <button type="button" class="ghost" data-act="logout">退出</button>
    </header>
    <div class="content">
      <div id="readbar"></div>
      <p class="muted" id="msg"></p>
      <div id="view"></div>
    </div>
    <nav class="dock">
      <button type="button" data-act="tab" data-tab="waterline" class="on">水线</button>
      <button type="button" data-act="tab" data-tab="crossday">跨日</button>
      <button type="button" data-act="tab" data-tab="trace">追索</button>
      <button type="button" data-act="tab" data-tab="gaps">缺口</button>
      <button type="button" data-act="tab" data-tab="templates">模板</button>
    </nav>
  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>
